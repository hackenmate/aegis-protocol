name: AEGIS CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Compile AegisGuard
        run: |
          rm -rf .solc-out
          npx --yes solc@0.8.30 --bin --abi contracts/AegisGuard.sol --output-dir .solc-out
          echo 'AEGIS_GUARD_BYTECODE_BEGIN'
          cat .solc-out/contracts_AegisGuard_sol_AegisGuard.bin
          echo '\nAEGIS_GUARD_BYTECODE_END'
          echo 'AEGIS_GUARD_ABI_BEGIN'
          cat .solc-out/contracts_AegisGuard_sol_AegisGuard.abi
          echo '\nAEGIS_GUARD_ABI_END'
