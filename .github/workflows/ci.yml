name: AEGIS CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Compile AegisGuard
        run: npx --yes solc@0.8.30 --bin contracts/AegisGuard.sol --output-dir .solc-out
